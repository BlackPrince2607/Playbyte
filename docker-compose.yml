services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: maja
      POSTGRES_PASSWORD: maja
      POSTGRES_DB: maja
    ports:
      - "5432:5432"
    volumes:
      - maja_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maja"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://maja:maja@postgres:5432/maja
      DATABASE_URL_SYNC: postgresql://maja:maja@postgres:5432/maja
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  worker:
    build:
      context: ./backend
    command: python -m worker.main
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://maja:maja@postgres:5432/maja
      DATABASE_URL_SYNC: postgresql://maja:maja@postgres:5432/maja
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

volumes:
  maja_pg:
