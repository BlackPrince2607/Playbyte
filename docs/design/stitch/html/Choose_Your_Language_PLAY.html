<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>PLAY - Choose Language</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

        tailwind.config = {

            theme: {
                extend: {
                    "colors": {
                        "surface": "#1d1013",
                        "on-tertiary-fixed-variant": "#00530f",

                        "on-surface-variant": "#e1bec5",
                        "tertiary-container": "#00a92a",
                        "line": "rgba(245, 240, 255, 0.12)",
                        "inverse-on-surface": "#3c2c30",

                        "inverse-primary": "#b90a5a",

                        "surface-container-highest": "#413034",

                        "secondary-container": "#a2d801"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "xs": "4px",
                        "xl": "32px",
                        "lg": "24px",
                        "md": "16px",
                        "gutter": "16px",
                        "margin": "20px"
                    },
                    "fontFamily": {
                        "game-question-mobile": ["spaceGrotesk"],
                        "large-score": ["spaceGrotesk"],
                        "body-sm": ["inter"],
                        "screen-title": ["spaceGrotesk"],
                        "stats": ["jetbrainsMono"],
                        "hero": ["spaceGrotesk"],

                        "metadata": ["inter"],

                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],

                        "game-question": ["42px", { "lineHeight": "1.1", "fontWeight": "700" }]

<body class="bg-ink min-h-screen flex flex-col items-center justify-between font-sans overflow-x-hidden selection:bg-primary-container selection:text-paper">
<!-- Header Section -->
<header class="w-full max-w-[480px] px-margin pt-xl pb-md text-center">
<h1 class="font-hero-mobile text-hero-mobile text-paper tracking-tighter mb-sm">Play in your language.</h1>
<p class="font-body-lg text-body-lg text-lilac">Choose the language that feels most natural to you.</p>
</header>
<!-- Language Grid -->
<main class="w-full max-w-[480px] px-margin flex-1 flex flex-col justify-center">
<div class="grid grid-cols-2 gap-md w-full">
<!-- English -->
<button class="bg-card border border-line rounded-[14px] p-md flex flex-col items-center justify-center aspect-[4/3] active:scale-95 transition-transform hover:border-primary-container group">
<span class="font-hero-mobile text-hero-mobile text-paper mb-xs group-hover:text-primary-container transition-colors">A</span>
<span class="font-body-sm text-body-sm text-lilac font-bold">English</span>
</button>
<!-- Hinglish -->
<button class="bg-card border border-line rounded-[14px] p-md flex flex-col items-center justify-center aspect-[4/3] active:scale-95 transition-transform hover:border-primary-container group">
<div class="flex items-center gap-1 mb-xs">
<span class="font-hero-mobile text-hero-mobile text-paper group-hover:text-primary-container transition-colors">A</span>
<span class="font-hero-mobile text-hero-mobile text-paper opacity-50">/</span>
<span class="font-hero-mobile text-hero-mobile text-paper group-hover:text-primary-container transition-colors">अ</span>
</div>
<span class="font-body-sm text-body-sm text-lilac font-bold">Hinglish</span>
</button>
<!-- Hindi (Selected State) -->
<button class="bg-cardAlt border-2 border-primary-container rounded-[14px] p-md flex flex-col items-center justify-center aspect-[4/3] active:scale-95 transition-transform relative overflow-hidden shadow-[0_0_15px_rgba(255,77,141,0.2)]">
<div class="absolute top-2 right-2 text-primary-container">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<span class="font-hero-mobile text-hero-mobile text-paper mb-xs text-primary-container">अ</span>
<span class="font-body-sm text-body-sm text-paper font-bold">हिन्दी</span>
</button>
<!-- Marathi -->
<button class="bg-card border border-line rounded-[14px] p-md flex flex-col items-center justify-center aspect-[4/3] active:scale-95 transition-transform hover:border-primary-container group">
<span class="font-hero-mobile text-hero-mobile text-paper mb-xs group-hover:text-primary-container transition-colors">अ</span>
<span class="font-body-sm text-body-sm text-lilac font-bold">मराठी</span>
</button>
<!-- Bengali -->
<button class="bg-card border border-line rounded-[14px] p-md flex flex-col items-center justify-center aspect-[4/3] active:scale-95 transition-transform hover:border-primary-container group">
<span class="font-hero-mobile text-hero-mobile text-paper mb-xs group-hover:text-primary-container transition-colors">অ</span>
<span class="font-body-sm text-body-sm text-lilac font-bold">বাংলা</span>
</button>
<!-- Tamil -->
<button class="bg-card border border-line rounded-[14px] p-md flex flex-col items-center justify-center aspect-[4/3] active:scale-95 transition-transform hover:border-primary-container group">
<span class="font-hero-mobile text-hero-mobile text-paper mb-xs group-hover:text-primary-container transition-colors">அ</span>
<span class="font-body-sm text-body-sm text-lilac font-bold">தமிழ்</span>
</button>
<!-- Telugu -->
<button class="bg-card border border-line rounded-[14px] p-md flex flex-col items-center justify-center aspect-[4/3] active:scale-95 transition-transform hover:border-primary-container group">
<span class="font-hero-mobile text-hero-mobile text-paper mb-xs group-hover:text-primary-container transition-colors">అ</span>
<span class="font-body-sm text-body-sm text-lilac font-bold">తెలుగు</span>
</button>
<!-- Kannada -->
<button class="bg-card border border-line rounded-[14px] p-md flex flex-col items-center justify-center aspect-[4/3] active:scale-95 transition-transform hover:border-primary-container group">
<span class="font-hero-mobile text-hero-mobile text-paper mb-xs group-hover:text-primary-container transition-colors">ಅ</span>
<span class="font-body-sm text-body-sm text-lilac font-bold">ಕನ್ನಡ</span>
</button>
</div>
</main>
<!-- Bottom Actions -->
<footer class="w-full max-w-[480px] px-margin py-lg mt-auto">
<p class="font-body-sm text-body-sm text-lilac text-center mb-md max-w-[80%] mx-auto">Games, questions, jokes and recommendations will adapt to your language and culture.</p>
<button class="w-full bg-primary-container text-paper font-body-sm text-body-sm font-bold py-4 rounded-[14px] active:scale-[0.98] transition-transform flex items-center justify-center gap-2 hover:opacity-90">
            Continue
            <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</footer>
</body></html>
