<style type="text/tailwindcss">
        @layer utilities {
            .glow-pink {
                box-shadow: 0 0 15px rgba(255, 77, 141, 0.4);
            }
        }
        
        .interest-card {
            transition: all 0.2s ease-in-out;
        }
        
        .interest-card.selected {
            border-color: #ff4d8d !important;
            background-color: #2a1c1f;
            box-shadow: 0 0 15px rgba(255, 77, 141, 0.4);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="bg-ink text-paper min-h-screen flex flex-col font-body-lg selection:bg-primary-container selection:text-on-primary-container overflow-hidden">
<!-- Header Section -->
<header class="px-margin pt-xl pb-gutter flex-shrink-0">
<h1 class="font-hero-mobile text-hero-mobile text-paper mb-sm">What do you love?</h1>
<p class="font-body-lg text-body-lg text-lilac">Pick a few things and we'll build your first game feed.</p>
</header>
<!-- Scrollable Grid Area -->
<main class="flex-1 overflow-y-auto px-margin pb-32 no-scrollbar" style="scrollbar-width: none;">
<div class="grid grid-cols-2 gap-gutter">
<button class="interest-card h-24 bg-card rounded-2xl border border-line flex flex-col items-center justify-center gap-2 active:scale-95" onclick="toggleSelection(this)">
<span class="text-3xl">🏏</span>
<span class="font-body-lg text-body-lg font-bold">Cricket</span>
</button>
<button class="interest-card h-24 bg-card rounded-2xl border border-line flex flex-col items-center justify-center gap-2 active:scale-95" onclick="toggleSelection(this)">
<span class="text-3xl">🎬</span>
<span class="font-body-lg text-body-lg font-bold">Bollywood</span>
</button>
<button class="interest-card h-24 bg-cardAlt rounded-2xl border border-line flex flex-col items-center justify-center gap-2 active:scale-95 selected" onclick="toggleSelection(this)">
<span class="text-3xl">😂</span>
<span class="font-body-lg text-body-lg font-bold">Memes</span>
</button>
<button class="interest-card h-24 bg-card rounded-2xl border border-line flex flex-col items-center justify-center gap-2 active:scale-95" onclick="toggleSelection(this)">
<span class="text-3xl">❤️</span>
<span class="font-body-lg text-body-lg font-bold">Relationships</span>
</button>
<button class="interest-card h-24 bg-card rounded-2xl border border-line flex flex-col items-center justify-center gap-2 active:scale-95 selected" onclick="toggleSelection(this)">
<span class="text-3xl">🧠</span>
<span class="font-body-lg text-body-lg font-bold">Puzzles</span>
</button>
<button class="interest-card h-24 bg-cardAlt rounded-2xl border border-line flex flex-col items-center justify-center gap-2 active:scale-95 selected" onclick="toggleSelection(this)">
<span class="text-3xl">🎵</span>
<span class="font-body-lg text-body-lg font-bold">Music</span>
</button>
<button class="interest-card h-24 bg-card rounded-2xl border border-line flex flex-col items-center justify-center gap-2 active:scale-95" onclick="toggleSelection(this)">
<span class="text-3xl">🍕</span>
<span class="font-body-lg text-body-lg font-bold">Food</span>
</button>
<button class="interest-card h-24 bg-card rounded-2xl border border-line flex flex-col items-center justify-center gap-2 active:scale-95 selected" onclick="toggleSelection(this)">
<span class="text-3xl">🔥</span>
<span class="font-body-lg text-body-lg font-bold">Trending</span>
</button>
<button class="interest-card h-24 bg-cardAlt rounded-2xl border border-line flex flex-col items-center justify-center gap-2 active:scale-95" onclick="toggleSelection(this)">
<span class="text-3xl">⚽</span>
<span class="font-body-lg text-body-lg font-bold">Sports</span>
</button>
<button class="interest-card h-24 bg-card rounded-2xl border border-line flex flex-col items-center justify-center gap-2 active:scale-95 selected" onclick="toggleSelection(this)">
<span class="text-3xl">🇮🇳</span>
<span class="font-body-lg text-body-lg font-bold">India</span>
</button>
</div>
</main>
<!-- Bottom Fixed Action Area -->
<div class="fixed bottom-0 left-0 w-full bg-gradient-to-t from-ink via-ink to-transparent pt-12 pb-8 px-margin z-50">
<div class="flex flex-col items-center gap-md">
<div class="font-stats text-stats text-primary-container bg-surface-container px-4 py-1 rounded-full border border-primary-container/30">
<span id="selected-count">5</span> selected
            </div>
<button class="w-full h-14 bg-primary-container text-paper font-body-lg text-body-lg font-bold rounded-xl flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all shadow-[0_0_20px_rgba(255,77,141,0.3)]">
                Build my feed <span class="material-symbols-outlined">arrow_forward</span>
</button>
</div>
</div>
<script>
        function toggleSelection(element) {
            element.classList.toggle('selected');
            updateCount();
        }

        function updateCount() {
            const count = document.querySelectorAll('.interest-card.selected').length;
            document.getElementById('selected-count').textContent = count;
        }
    </script>
</body></html>
