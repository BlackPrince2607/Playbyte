<!DOCTYPE html><html class="dark" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>PLAY - Social Poll Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&amp;family=JetBrains+Mono:wght@500&amp;family=Space+Grotesk:wght@700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "tertiary-container": "#00a92a",
                        "primary-container": "#ff4d8d",
                        "on-error": "#690005",
                        "surface-container-lowest": "#170a0e",
                        "surface-tint": "#ffb1c4",
                        "tertiary-fixed": "#75ff75",
                        "cardAlt": "#2A1B4E",
                        "surface-container": "#2a1c1f",
                        "card": "#211540",
                        "line": "rgba(245, 240, 255, 0.12)",
                        "ink": "#150E2B",
                        "on-surface-variant": "#e1bec5",
                        "inverse-primary": "#b90a5a",
                        "on-background": "#f7dce1",
                        "on-tertiary-fixed": "#002203",
                        "tertiary": "#57e15b",
                        "inverse-on-surface": "#3c2c30",
                        "on-primary-container": "#5b0028",
                        "primary-fixed": "#ffd9e0",
                        "secondary": "#bdf532",
                        "background": "#1d1013",
                        "on-primary-fixed-variant": "#8f0043",
                        "on-surface": "#f7dce1",
                        "surface-container-highest": "#413034",
                        "outline-variant": "#594046",
                        "tertiary-fixed-dim": "#57e15b",
                        "secondary-fixed": "#bdf532",
                        "surface-variant": "#413034",
                        "on-secondary": "#263500",
                        "inverse-surface": "#f7dce1",
                        "surface-container-high": "#362629",
                        "error": "#ffb4ab",
                        "on-primary-fixed": "#3f001a",
                        "on-tertiary-container": "#003306",
                        "on-secondary-fixed": "#141f00",
                        "on-secondary-container": "#425a00",
                        "surface": "#1d1013",
                        "on-secondary-fixed-variant": "#384e00",
                        "on-tertiary-fixed-variant": "#00530f",
                        "error-container": "#93000a",
                        "surface-bright": "#463538",
                        "secondary-container": "#a2d801",
                        "on-error-container": "#ffdad6",
                        "paper": "#F5F0FF",
                        "surface-dim": "#1d1013",
                        "on-primary": "#65002e",
                        "primary-fixed-dim": "#ffb1c4",
                        "surface-container-low": "#26181b",
                        "secondary-fixed-dim": "#a2d801",
                        "on-tertiary": "#003908",
                        "primary": "#ffb1c4",
                        "lilac": "#8F7FC0",
                        "outline": "#a8898f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px",
                        "card": "24px",
                        "btn": "14px"
                    },
                    "spacing": {
                        "margin": "20px",
                        "xs": "4px",
                        "sm": "8px",
                        "lg": "24px",
                        "gutter": "16px",
                        "xl": "32px",
                        "md": "16px"
                    },
                    "fontFamily": {
                        "hero-mobile": ["Space Grotesk"],
                        "screen-title": ["Space Grotesk"],
                        "stats": ["JetBrains Mono"],
                        "micro": ["Inter"],
                        "large-score": ["Space Grotesk"],
                        "game-question": ["Space Grotesk"],
                        "hero": ["Space Grotesk"],
                        "body-sm": ["Inter"],
                        "metadata": ["Inter"],
                        "body-lg": ["Inter"],
                        "game-question-mobile": ["Space Grotesk"]
                    },
                    "fontSize": {
                        "hero-mobile": ["40px", { "lineHeight": "1.1", "fontWeight": "700" }],
                        "screen-title": ["34px", { "lineHeight": "1.2", "fontWeight": "700" }],
                        "stats": ["24px", { "lineHeight": "1.4", "fontWeight": "500" }],
                        "micro": ["10px", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "large-score": ["72px", { "lineHeight": "1", "fontWeight": "700" }],
                        "game-question": ["42px", { "lineHeight": "1.1", "fontWeight": "700" }],
                        "hero": ["48px", { "lineHeight": "1.1", "fontWeight": "700" }],
                        "body-sm": ["14px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "metadata": ["12px", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "1.5", "fontWeight": "400" }],
                        "game-question-mobile": ["30px", { "lineHeight": "1.1", "fontWeight": "700" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: theme('colors.ink');
            color: theme('colors.paper');
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1;
        }
        /* Custom animations for results reveal */
        @keyframes fillBar {
            from { width: 0%; opacity: 0; }
            to { opacity: 1; }
        }
        .bar-animate {
            animation: fillBar 1s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col relative pb-24 pt-20">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-transparent flat no shadows flex justify-between items-center px-margin py-4 transition-opacity duration-200 active:scale-95 text-primary">
<!-- Leading: Avatar -->
<div class="relative w-10 h-10 rounded-full overflow-hidden border-2 border-primary cursor-pointer hover:opacity-80 transition-opacity">
<img alt="User Profile" class="w-full h-full object-cover" data-alt="A detailed close-up portrait of a youthful gamer avatar. The character has vibrant, expressive features with neon pink and lime green highlights in their hair. The lighting is cinematic and high-contrast, perfectly matching the deep nocturnal 'Ink' aesthetic of a premium competitive social gaming interface. The background is a subtle, out-of-focus dark surface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCOZlux3OAdBWG74T8ACFlp_FLVxkFiKral7wXmZ7Po5WAgWa640M883h3LuccIrL8rXmdlizhXkn-7EZtuBn0ypo8H2Z6Ct-anCg5jFluYS2Z5TEffq3qTOXbwtXR1FGEzqrJUwqO8qCuZKZiUB9p62dR-TdiDGIssgeo99aJvOJwyC7f9_OMjSBHyEA0V33pL5IP_BGQz8i4jhPrMSUIfKatAENJPoMJq8Qq0qME1FtDSIkJ4PO0kzQ">
<!-- Active Story Ring (Simulated by border above) -->
</div>
<!-- Headline -->
<h1 class="font-screen-title-mobile text-screen-title-mobile tracking-tighter text-primary">PLAY</h1>
<!-- Trailing: Action -->
<div class="flex items-center gap-1 font-stats text-stats text-primary hover:opacity-80 transition-opacity cursor-pointer">
<span>7</span>
<span class="material-symbols-outlined icon-fill text-primary" data-icon="local_fire_department">local_fire_department</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex flex-col px-margin w-full max-w-md mx-auto h-full relative">
<!-- Badges Area -->
<div class="flex justify-between items-center mb-xl mt-4">
<!-- Hot Take Badge -->
<div class="bg-primary-container text-on-primary-container font-metadata text-metadata px-3 py-1 rounded-full font-bold tracking-wider uppercase inline-flex items-center gap-1 border border-primary-container shadow-[0_0_10px_rgba(255,77,141,0.3)]">
<span class="material-symbols-outlined text-sm" data-icon="whatshot">whatshot</span>
                🔥 HOT TAKE
            </div>
<!-- Live Status Badge -->
<div class="bg-secondary text-on-secondary font-stats text-metadata px-3 py-1 rounded-full inline-flex items-center gap-1 shadow-[0_0_10px_rgba(189,245,50,0.2)] animate-pulse">
<span class="w-2 h-2 rounded-full bg-on-secondary relative overflow-hidden">
<span class="absolute inset-0 bg-on-secondary rounded-full animate-ping opacity-75"></span>
</span>
                6.8K people voting
            </div>
</div>
<!-- Game Card (Centerpiece) -->
<div class="bg-card rounded-[24px] border border-line p-lg flex-grow flex flex-col relative overflow-hidden mb-xl shadow-2xl">
<!-- Subtle background accent -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-container/10 rounded-full blur-3xl -mr-10 -mt-10 pointer-events-none"></div>
<!-- Question -->
<h2 class="font-game-question-mobile text-game-question-mobile text-center text-paper mb-xl leading-tight">
                Best late-night food?
            </h2>
<!-- Results State Indicator -->
<div class="text-center mb-6">
<span class="font-metadata text-metadata text-secondary bg-secondary/10 px-3 py-1 rounded-full border border-secondary/20">
                    Your answer: Maggi
                </span>
</div>
<!-- Options / Results Bars -->
<div class="flex flex-col gap-gutter flex-grow justify-center">
<!-- Option 1: Maggi (Selected / Primary) -->
<div class="relative w-full h-14 bg-cardAlt rounded-btn border-2 border-secondary overflow-hidden flex items-center shadow-[0_0_15px_rgba(189,245,50,0.15)] group transition-transform hover:scale-[1.01]">
<!-- Fill Bar -->
<div class="absolute top-0 left-0 h-full bg-secondary/20 bar-animate" style="width: 67%;"></div>
<!-- Content -->
<div class="relative w-full px-4 flex justify-between items-center z-10">
<span class="font-body-lg text-body-lg font-bold text-secondary flex items-center gap-2">
<span class="material-symbols-outlined icon-fill text-lg" data-icon="check_circle">check_circle</span>
                            Maggi
                        </span>
<span class="font-stats text-stats text-secondary font-bold">67%</span>
</div>
</div>
<!-- Option 2: Pizza -->
<div class="relative w-full h-14 bg-cardAlt rounded-btn border border-line overflow-hidden flex items-center group transition-transform hover:scale-[1.01]">
<!-- Fill Bar -->
<div class="absolute top-0 left-0 h-full bg-line/20 bar-animate" style="width: 21%;"></div>
<!-- Content -->
<div class="relative w-full px-4 flex justify-between items-center z-10">
<span class="font-body-lg text-body-lg text-lilac">Pizza</span>
<span class="font-stats text-body-lg text-lilac">21%</span>
</div>
</div>
<!-- Option 3: Paratha -->
<div class="relative w-full h-14 bg-cardAlt rounded-btn border border-line overflow-hidden flex items-center group transition-transform hover:scale-[1.01]">
<!-- Fill Bar -->
<div class="absolute top-0 left-0 h-full bg-line/20 bar-animate" style="width: 12%;"></div>
<!-- Content -->
<div class="relative w-full px-4 flex justify-between items-center z-10">
<span class="font-body-lg text-body-lg text-lilac">Paratha</span>
<span class="font-stats text-body-lg text-lilac">12%</span>
</div>
</div>
</div>
</div>
<!-- Social Context & Interactions -->
<div class="mt-auto flex flex-col gap-gutter">
<!-- Social Context -->
<div class="bg-cardAlt rounded-xl border border-line p-3 flex items-center justify-between shadow-lg">
<div class="flex items-center gap-2">
<div class="w-8 h-8 rounded-full overflow-hidden border border-line">
<img alt="Rahul" class="w-full h-full object-cover" data-alt="A close-up avatar of a rival player named Rahul. He has a confident, slightly mischievous smirk. The lighting is cinematic with a moody dark aesthetic, accented by subtle neon pink edges reflecting off his jawline, fitting perfectly within a high-contrast corporate modern gaming UI." src="https://lh3.googleusercontent.com/aida-public/AB6AXuAWITaGglhlDOEB7fBLzjLxGRwAdYy0xTAq9Togqla5V3OzVcOcIYLNnDBOc1bvTyQbY5mR_V5oay-dSGVtVhTPC16Cmo1E-YMmoJh3VD8YS0R_mB_0wznYmoAu0OaBJpzttXlRaATMExup9zgqcskp1EVLE6aEnE9aY6jiEzGxusAyZetvAEc2_UEr303V7dc4FhxOiUe4ZzKKpGV0jSz8n68pqmGVyiCDb2pLrosuZZmkgWLjzZJi5w">
</div>
<span class="font-body-sm text-body-sm text-paper">Rahul chose Pizza <span class="text-lg">😏</span></span>
</div>
<button class="bg-primary text-on-primary font-body-sm text-body-sm font-bold px-4 py-2 rounded-btn active:scale-95 transition-transform flex items-center gap-1 shadow-md">
<span class="material-symbols-outlined text-sm" data-icon="swords">swords</span>
                    Challenge
                </button>
</div>
<!-- Interaction Bar -->
<div class="flex items-center justify-between px-2 pt-2 border-t border-line pb-2">
<button class="flex items-center gap-1 text-lilac hover:text-primary transition-colors group">
<span class="material-symbols-outlined group-hover:icon-fill" data-icon="favorite">favorite</span>
<span class="font-stats text-metadata">1.2K</span>
</button>
<button class="flex items-center gap-1 text-lilac hover:text-paper transition-colors">
<span class="material-symbols-outlined" data-icon="chat_bubble">chat_bubble</span>
<span class="font-stats text-metadata">342</span>
</button>
<button class="flex items-center gap-1 text-lilac hover:text-secondary transition-colors">
<span class="material-symbols-outlined" data-icon="send">send</span>
</button>
<button class="flex items-center gap-1 text-lilac hover:text-primary-container transition-colors">
<span class="material-symbols-outlined" data-icon="flag">flag</span>
</button>
</div>
<!-- Swipe Indicator -->
<div class="text-center mt-2 flex flex-col items-center justify-center text-lilac/60 animate-bounce pb-4">
<span class="font-metadata text-metadata uppercase tracking-widest mb-1">Swipe for next game</span>
<span class="material-symbols-outlined" data-icon="keyboard_arrow_down">keyboard_arrow_down</span>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 pb-6 pt-3 bg-surface border-t-0 shadow-lg md:hidden">
<!-- Tab 1: Feed (Active) -->
<button class="flex flex-col items-center justify-center text-secondary dark:text-secondary hover:text-primary transition-all duration-300 active:scale-90 group relative">
<div class="absolute -top-3 w-8 h-1 bg-secondary rounded-full"></div>
<span class="material-symbols-outlined icon-fill mb-1" data-icon="style">style</span>
<span class="font-metadata text-metadata">Feed</span>
</button>
<!-- Tab 2: Compete -->
<button class="flex flex-col items-center justify-center text-lilac dark:text-lilac opacity-60 hover:text-primary transition-all duration-300 active:scale-90">
<span class="material-symbols-outlined mb-1" data-icon="emoji_events">emoji_events</span>
<span class="font-metadata text-metadata">Compete</span>
</button>
<!-- Tab 3: Friends -->
<button class="flex flex-col items-center justify-center text-lilac dark:text-lilac opacity-60 hover:text-primary transition-all duration-300 active:scale-90">
<span class="material-symbols-outlined mb-1" data-icon="group">group</span>
<span class="font-metadata text-metadata">Friends</span>
</button>
<!-- Tab 4: Vault -->
<button class="flex flex-col items-center justify-center text-lilac dark:text-lilac opacity-60 hover:text-primary transition-all duration-300 active:scale-90">
<span class="material-symbols-outlined mb-1" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-metadata text-metadata">Vault</span>
</button>
</nav>
<!-- Desktop Nav Fallback (hidden on mobile, visible on md+) -->
<div class="hidden md:flex fixed left-0 top-0 h-full w-64 bg-surface border-r border-line flex-col p-lg z-40">
<h1 class="font-screen-title text-screen-title tracking-tighter text-primary mb-xl mt-4">PLAY</h1>
<nav class="flex flex-col gap-4">
<button class="flex items-center gap-3 text-secondary bg-secondary/10 px-4 py-3 rounded-xl transition-all duration-300">
<span class="material-symbols-outlined icon-fill" data-icon="style">style</span>
<span class="font-body-lg text-body-lg font-bold">Feed</span>
</button>
<button class="flex items-center gap-3 text-lilac hover:text-primary hover:bg-card px-4 py-3 rounded-xl transition-all duration-300">
<span class="material-symbols-outlined" data-icon="emoji_events">emoji_events</span>
<span class="font-body-lg text-body-lg font-bold">Compete</span>
</button>
<button class="flex items-center gap-3 text-lilac hover:text-primary hover:bg-card px-4 py-3 rounded-xl transition-all duration-300">
<span class="material-symbols-outlined" data-icon="group">group</span>
<span class="font-body-lg text-body-lg font-bold">Friends</span>
</button>
<button class="flex items-center gap-3 text-lilac hover:text-primary hover:bg-card px-4 py-3 rounded-xl transition-all duration-300">
<span class="material-symbols-outlined" data-icon="account_balance_wallet">account_balance_wallet</span>
<span class="font-body-lg text-body-lg font-bold">Vault</span>
</button>
</nav>
</div>
</body></html>
