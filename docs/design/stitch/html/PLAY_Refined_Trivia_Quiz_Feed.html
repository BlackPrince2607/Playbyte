<script>
        // Micro-interaction for answers
        const buttons = document.querySelectorAll('button:has(> *:not(span))'); // Select answer buttons crudely
        const answerButtons = Array.from(document.querySelectorAll('.flex-col.gap-sm button'));
        
        answerButtons.forEach(btn => {
            btn.addEventListener('click', function() {
                // Reset all
                answerButtons.forEach(b => {
                    b.classList.remove('bg-primary', 'text-ink', 'border-primary', 'font-bold');
                    b.classList.add('bg-cardAlt', 'text-paper', 'border-line');
                });
                
                // Set active (simulating correct answer visually for prototype)
                this.classList.remove('bg-cardAlt', 'text-paper', 'border-line');
                this.classList.add('bg-primary', 'text-ink', 'border-primary', 'font-bold');
            });
        });

        // Timer animation script
        setTimeout(() => {
            const circle = document.querySelector('.timer-ring');
            if(circle) {
                // Animate to empty over 5 seconds roughly
                circle.style.strokeDashoffset = '100';
            }
        }, 100);
