# Railway — Playbyte outbox worker (same image as API, different start command)
# Create a second Railway service from the same repo:
#   Root Directory = backend
#   Override start command to: python -m worker.main
# No public HTTP domain needed for the worker.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python -m worker.main"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
