# Railway — Playbyte API (FastAPI)
# In Railway: create a service from this GitHub repo with Root Directory = backend
# Start command is defined below; healthcheck uses /health.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
