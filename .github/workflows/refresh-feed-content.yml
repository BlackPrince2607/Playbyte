name: Refresh feed content

on:
  schedule:
    # Every 4 hours
    - cron: "0 */4 * * *"
  workflow_dispatch:

concurrency:
  group: refresh-feed-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh live feed moments
        env:
          MAJA_API_URL: ${{ secrets.MAJA_API_URL }}
          MAJA_ADMIN_KEY: ${{ secrets.MAJA_ADMIN_KEY }}
        run: |
          if [ -z "$MAJA_API_URL" ] || [ -z "$MAJA_ADMIN_KEY" ]; then
            echo "Missing MAJA_API_URL or MAJA_ADMIN_KEY secrets."
            exit 1
          fi
          python scripts/refresh_feed_content.py \
            --api-url "$MAJA_API_URL" \
            --admin-key "$MAJA_ADMIN_KEY" \
            --count 40 \
            --window-hours 12 \
            --include-images
